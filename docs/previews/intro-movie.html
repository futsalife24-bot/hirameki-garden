<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ひらめきの庭 オープニング試作</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@500;900&family=Unbounded:wght@400;700&display=swap" rel="stylesheet">
<style>
/* 「ひらめきの庭」全体のオープニング試作。テーマは「ひらめき」の瞬間。特定のゲームの世界観には寄せない。約8.6秒。 */
:root{--bg:#0b0b10;--cream:#f4f1ea;--dim:#f4f1ea80;--blue:#4a6dff;--coral:#ff5d4f;--lime:#c9f26b;--violet:#a084ff;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);overflow:hidden;color:var(--cream);font-family:'Zen Kaku Gothic New',system-ui,sans-serif}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
.layer{position:fixed;inset:0;pointer-events:none}
.frame{inset:clamp(14px,3vmin,28px)}
.frame i{position:absolute;left:0;right:0;height:1px;background:#f4f1ea30;transform-origin:left}
.frame i:first-child{top:0}.frame i:nth-child(2){bottom:0;transform-origin:right}
.cap{position:absolute;font-family:Unbounded,sans-serif;font-size:clamp(8px,1.2vmin,10px);letter-spacing:.32em;color:var(--dim);font-variant-numeric:tabular-nums}
.cap.tl{top:14px;left:0}.cap.tr{top:14px;right:0}.cap.bl{bottom:14px;left:0}.cap.br{bottom:14px;right:0}
.beat{position:absolute;left:clamp(28px,7vw,110px);bottom:clamp(70px,13vh,140px);display:flex;align-items:baseline;gap:18px;opacity:0}
.beat b{font-family:Unbounded,sans-serif;font-weight:400;font-size:clamp(10px,1.4vmin,12px);letter-spacing:.2em;color:var(--c)}
.beat span{font-weight:900;font-size:clamp(30px,5.6vmin,58px);letter-spacing:.08em}
.logo{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding-top:12vmin}
.logo h1{margin:0;font-weight:900;font-size:clamp(40px,8.4vmin,88px);letter-spacing:.12em;line-height:1.25;white-space:nowrap}
.logo h1 .m{display:inline-block;overflow:hidden;vertical-align:bottom;padding:0 .02em}
.logo h1 .m>span{display:inline-block;transform:translateY(110%)}
.logo .en{font-family:Unbounded,sans-serif;font-size:clamp(9px,1.5vmin,13px);letter-spacing:.6em;margin:18px 0 0 .6em;opacity:0}
.logo .bar{width:min(52vw,380px);height:3px;margin-top:24px;border-radius:2px;background:linear-gradient(90deg,var(--blue),var(--violet),var(--coral),var(--lime));transform:scaleX(0)}
.logo .tag{font-size:clamp(11px,1.7vmin,14px);font-weight:500;letter-spacing:.3em;margin:20px 0 0 .3em;color:#f4f1eacc;opacity:0}
#iris{position:fixed;inset:0;background:#f6f4ef;clip-path:circle(0px at 50% 50%);pointer-events:none}
.end{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;color:#2a2a30;font-size:13px;letter-spacing:.2em;line-height:2.2;opacity:0;pointer-events:none;padding:16px}
.ui{position:fixed;right:max(16px,env(safe-area-inset-right));bottom:max(18px,env(safe-area-inset-bottom));z-index:5}
.ui button{font:inherit;font-size:12px;letter-spacing:.18em;min-height:44px;padding:10px 18px;border-radius:999px;cursor:pointer;background:#f4f1ea14;border:1px solid #f4f1ea55;color:var(--cream);backdrop-filter:blur(6px)}
.ui button:focus-visible{outline:2px solid var(--lime);outline-offset:3px}
body.done .ui button{color:#2a2a30;border-color:#2a2a3055;background:transparent}
#replay{display:none}body.done #replay{display:inline-block}body.done #skip{display:none}
@media(max-width:640px){.cap.tr{display:none}.beat{left:50%;translate:-50% 0;bottom:15vh;white-space:nowrap}.logo{padding-top:14vmin}}
</style>
</head>
<body>
<canvas id="c" aria-hidden="true"></canvas>
<div class="layer frame" id="frame" aria-hidden="true"><i></i><i></i>
  <span class="cap tl">HIRAMEKI GARDEN</span><span class="cap tr">OPENING — THE MOMENT OF HIRAMEKI</span>
  <span class="cap bl" id="tc">00:00:00</span><span class="cap br" id="idx">00 / 03</span>
</div>
<div class="layer" aria-hidden="true">
  <p class="beat" id="b1" style="--c:var(--violet)"><b>01</b><span>迷って、</span></p>
  <p class="beat" id="b2" style="--c:var(--cream)"><b>02</b><span>ふと、</span></p>
  <p class="beat" id="b3" style="--c:var(--lime)"><b>03</b><span>ひらめく。</span></p>
</div>
<div class="layer logo" id="logo">
  <h1 aria-label="ひらめきの庭"></h1>
  <p class="en">HIRAMEKI GARDEN</p>
  <div class="bar"></div>
  <p class="tag">ひらめきを、集める庭。</p>
</div>
<div id="iris"></div>
<p class="end" id="end">試作はここまで。<br>本編では、この光から<br>選択中のゲームの<br>タイトル画面へ切り替わります。</p>
<div class="ui"><button id="skip" type="button">スキップ ›</button><button id="replay" type="button">もう一度見る ↺</button></div>

<script>
const DURATION=8.6;
const cv=document.getElementById('c'),x=cv.getContext('2d');
const $=id=>document.getElementById(id);
const h1=document.querySelector('.logo h1');
[...'ひらめきの庭'].forEach(ch=>{const m=document.createElement('span');m.className='m';m.innerHTML=`<span>${ch}</span>`;h1.appendChild(m)});
const letters=[...h1.querySelectorAll('.m>span')];
const COLORS=['#4a6dff','#ff5d4f','#c9f26b','#a084ff'];

let W=0,H=0,S=0,cx=0,cy=0;
function resize(){const r=devicePixelRatio||1;W=innerWidth;H=innerHeight;cv.width=W*r;cv.height=H*r;x.setTransform(r,0,0,r,0,0);S=Math.min(W,H);cx=W/2;cy=H/2-S*.02}

// 補間
const clamp=v=>Math.max(0,Math.min(1,v));
const seg=(t,a,b)=>clamp((t-a)/(b-a));
const outExpo=v=>v>=1?1:1-Math.pow(2,-10*v);
const outBack=v=>{const c=1.9;return 1+(c+1)*Math.pow(v-1,3)+c*Math.pow(v-1,2)};
const inOut=v=>v<.5?4*v*v*v:1-Math.pow(-2*v+2,3)/2;
const inoutVis=(t,a,b,f=.3)=>Math.min(seg(t,a,a+f),1-seg(t,b-f,b));
const lerp=(a,b,k)=>a+(b-a)*k;

// 思考のかけら。固定の乱数で毎回同じ動きになる。
let seed=20261004;const rnd=()=>(seed=(seed*16807)%2147483647)/2147483647;
const COUNT=96,OUTLINE=64;
const bits=Array.from({length:COUNT},(_,i)=>({
  r:.1+.3*rnd(),w:(.35+.55*rnd())*(rnd()<.5?-1:1),ph:rnd()*Math.PI*2,
  k1:1+rnd()*2.2,k2:1+rnd()*2.2,p1:rnd()*7,p2:rnd()*7,amp:.03+.05*rnd(),
  born:rnd()*1.1,size:.6+rnd()*.9,dir:rnd()*Math.PI*2,fly:.35+.4*rnd(),col:COLORS[i%4]
}));

// 「ふと」で時間がほとんど止まる
function tau(t){
  if(t<3.3)return t;
  if(t<3.7){const d=t-3.3;return 3.3+d-2.4*d*d/2}
  return 3.508+.04*(t-3.7);
}
function wander(b,T){
  const tight=seg(T,1.6,3.5),r=S*b.r*(1-.4*tight),th=b.ph+b.w*T+b.w*.9*Math.pow(Math.max(0,T-1.6),2);
  return [cx+Math.cos(th)*r+S*b.amp*Math.sin(b.k1*T+b.p1),cy+Math.sin(th)*r*.82+S*b.amp*Math.cos(b.k2*T+b.p2)];
}
// ひらめきの印：四つの光の尖り（アステロイド）
const R=()=>S*.17;
function spark(i){const th=i/OUTLINE*Math.PI*2,c=Math.cos(th),s=Math.sin(th);return [cx+R()*c*c*c,cy+R()*s*s*s]}
function sparkPath(px,py,r){x.beginPath();for(let k=0;k<=96;k++){const th=k/96*Math.PI*2,c=Math.cos(th),s=Math.sin(th),X=px+r*c*c*c,Y=py+r*s*s*s;k?x.lineTo(X,Y):x.moveTo(X,Y)}x.closePath()}

const PING=4.2;
function render(t){
  x.globalAlpha=1;x.shadowBlur=0;
  const bg=x.createRadialGradient(cx,cy,0,cx,cy,Math.hypot(W,H)/2);bg.addColorStop(0,'#14141c');bg.addColorStop(1,'#0b0b10');x.fillStyle=bg;x.fillRect(0,0,W,H);

  const T=tau(t),hush=seg(t,3.3,3.7)*(1-seg(t,PING,PING+.05));
  const snap=outExpo(seg(t,PING,PING+.45)),gather=1-seg(t,4.75,5.2);
  x.lineCap='round';

  // 1〜2. 迷い：軌跡を引きながら漂う
  if(t<PING+.6){
    for(let i=1;i<COUNT;i++){
      const b=bits[i],vis=seg(t,b.born,b.born+.6);if(!vis)continue;
      const burst=i>=OUTLINE;
      if(t<PING){
        const a=vis*(.85-.55*hush);
        x.strokeStyle=`rgba(150,160,220,${.22*a})`;x.lineWidth=S*.0018*b.size;x.beginPath();
        for(let k=0;k<=12;k++){const [px,py]=wander(b,Math.max(0,T-.55*k/12));k?x.lineTo(px,py):x.moveTo(px,py)}
        x.stroke();
        const [px,py]=wander(b,T);x.fillStyle=`rgba(200,206,240,${a})`;x.beginPath();x.arc(px,py,S*.0035*b.size,0,7);x.fill();
      }else if(!burst){
        // 3. 一瞬で整列して光の形になる
        const [sx,sy]=wander(b,tau(PING)),[tx,ty]=spark(i);
        const px=lerp(sx,tx,snap),py=lerp(sy,ty,snap);
        x.globalAlpha=gather;x.fillStyle='#f4f1ea';x.shadowColor=b.col;x.shadowBlur=S*.02;x.beginPath();x.arc(px,py,S*.004*(1+.6*(1-snap)),0,7);x.fill();x.shadowBlur=0;x.globalAlpha=1;
      }
    }
  }
  // 火花：中心から四色で散る
  const fl=seg(t,PING,PING+.9);
  if(fl>0&&fl<1)for(let i=OUTLINE;i<COUNT;i++){
    const b=bits[i],d=S*(.04+b.fly*outExpo(fl)),px=cx+Math.cos(b.dir)*d,py=cy+Math.sin(b.dir)*d,d0=S*(.04+b.fly*outExpo(Math.max(0,fl-.08)));
    x.strokeStyle=b.col;x.globalAlpha=1-fl;x.lineWidth=S*.005*b.size;x.beginPath();x.moveTo(cx+Math.cos(b.dir)*d0,cy+Math.sin(b.dir)*d0);x.lineTo(px,py);x.stroke();x.globalAlpha=1;
  }

  // 2. ふと：ひとつのかけらが中心へ寄り、灯る
  if(t>=bits[0].born&&t<PING+.1){
    const b=bits[0],[wx,wy]=wander(b,T),m=inOut(seg(t,3.35,4.1)),px=lerp(wx,cx,m),py=lerp(wy,cy,m);
    const glow=S*(.004+.012*m)*(1+.12*Math.sin(t*18)*m);
    const g=x.createRadialGradient(px,py,0,px,py,S*.12*m+1);g.addColorStop(0,`rgba(244,241,234,${.4*m})`);g.addColorStop(1,'rgba(244,241,234,0)');x.fillStyle=g;x.fillRect(px-S*.13,py-S*.13,S*.26,S*.26);
    x.fillStyle='#f4f1ea';x.beginPath();x.arc(px,py,glow,0,7);x.fill();
  }

  // 3. ピン：衝撃の輪と光線
  const sw=seg(t,PING,PING+.85);
  if(sw>0&&sw<1){
    x.strokeStyle=`rgba(244,241,234,${.7*(1-sw)})`;x.lineWidth=S*.01*(1-sw)+1;x.beginPath();x.arc(cx,cy,S*(.03+.75*outExpo(sw)),0,7);x.stroke();
    const rl=seg(t,PING,PING+.7);x.lineWidth=S*.004;
    for(let k=0;k<8;k++){const a=k/8*Math.PI*2+Math.PI/8,r0=S*(.06+.5*outExpo(rl)),r1=r0+S*.18*(1-rl);x.strokeStyle=COLORS[k%4];x.globalAlpha=1-rl;x.beginPath();x.moveTo(cx+Math.cos(a)*r0,cy+Math.sin(a)*r0);x.lineTo(cx+Math.cos(a)*r1,cy+Math.sin(a)*r1);x.stroke()}
    x.globalAlpha=1;
  }

  // 4. 光の印 → 5. ロゴの上へ
  const fill=seg(t,4.5,5.0);
  if(fill>0){
    const mv=inOut(seg(t,5.5,6.15)),sc=1-.55*mv,oy=-S*.2*mv,fade=1-seg(t,7.7,8.05);
    const pulse=1+.04*Math.sin((t-4.5)*5)*(1-mv),rot=-.35*(1-inOut(seg(t,4.5,6.2)));
    x.save();x.translate(cx,cy+oy);x.rotate(rot);x.scale(sc*pulse,sc*pulse);x.globalAlpha=fade*fill;
    const g=x.createRadialGradient(0,0,0,0,0,R()*1.6);g.addColorStop(0,'rgba(244,241,234,.28)');g.addColorStop(1,'rgba(244,241,234,0)');x.fillStyle=g;x.fillRect(-R()*1.6,-R()*1.6,R()*3.2,R()*3.2);
    sparkPath(0,0,R()*(.85+.15*outBack(fill)));
    const lg=x.createLinearGradient(-R(),-R(),R(),R());lg.addColorStop(0,'#ffffff');lg.addColorStop(1,'#efe9da');x.fillStyle=lg;x.fill();
    // 小さな相棒の光
    const s2=outBack(seg(t,5.05,5.45));if(s2>0){sparkPath(R()*.78,-R()*.72,R()*.3*s2);x.fillStyle='#c9f26b';x.fill()}
    x.restore();x.globalAlpha=1;
  }
  const flash=(1-seg(t,PING,PING+.35))*(t>=PING?.45:0);if(flash>0){x.fillStyle=`rgba(255,255,255,${flash})`;x.fillRect(0,0,W,H)}

  // 文字
  const fr=seg(t,.3,1.2);
  $('frame').style.opacity=1-seg(t,7.6,8.0);document.querySelectorAll('.frame i').forEach(i=>i.style.transform=`scaleX(${outExpo(fr)})`);
  document.querySelectorAll('.cap').forEach(c=>c.style.opacity=seg(t,.6,1.2));
  const sec=Math.min(t,DURATION);$('tc').textContent=`00:${String(Math.floor(sec)).padStart(2,'0')}:${String(Math.floor(sec%1*24)).padStart(2,'0')}`;
  $('idx').textContent=`0${t<1?0:t<3.35?1:t<PING?2:3} / 03`;
  [[1.0,3.25,.3],[3.35,4.2,.2],[4.3,5.5,.25]].forEach(([a,b,f],k)=>{const el=$('b'+(k+1)),v=inoutVis(t,a,b,f),out=seg(t,b-f,b);el.style.opacity=v;el.style.transform=`translateY(${(1-seg(t,a,a+.35))*18-out*14}px)`;el.style.filter=`blur(${(1-v)*5}px)`});
  letters.forEach((l,i)=>{l.style.transform=`translateY(${(1-outExpo(seg(t,5.75+i*.07,6.4+i*.07)))*110}%)`});
  const logo=$('logo');logo.style.opacity=1-seg(t,7.75,8.05);
  logo.querySelector('.en').style.opacity=seg(t,6.35,6.9);logo.querySelector('.en').style.letterSpacing=`${.6+.4*(1-outExpo(seg(t,6.35,7.2)))}em`;
  logo.querySelector('.bar').style.transform=`scaleX(${inOut(seg(t,6.5,7.2))})`;
  logo.querySelector('.tag').style.opacity=seg(t,6.9,7.4);

  // 6. 光の印から白が広がり、タイトル画面へ渡す
  const ir=inOut(seg(t,7.85,8.6)),iy=cy-S*.2;$('iris').style.clipPath=`circle(${ir*Math.hypot(W/2,Math.max(iy,H-iy))+(ir>0?2:0)}px at 50% ${iy}px)`;
  $('end').style.opacity=seg(t,8.6,9.1);
  document.body.classList.toggle('done',t>=DURATION);
}

let start=0,fixed=null,raf=0;
const now=()=>fixed??(performance.now()-start)/1000;
function loop(){const t=now();render(t);if(fixed===null&&t<DURATION+.6)raf=requestAnimationFrame(loop)}
function play(){cancelAnimationFrame(raf);fixed=null;start=performance.now();loop()}
function seek(t){cancelAnimationFrame(raf);fixed=t;render(t)}
addEventListener('resize',()=>{resize();render(now())});resize();
$('skip').onclick=()=>{seek(DURATION+.6);$('replay').focus()};
$('replay').onclick=()=>{play();$('skip').focus()};
const q=new URLSearchParams(location.search).get('t');
render(0);
if(q!==null)seek(parseFloat(q));
else if(matchMedia('(prefers-reduced-motion: reduce)').matches)seek(7.4);
else Promise.race([document.fonts?document.fonts.ready:Promise.resolve(),new Promise(r=>setTimeout(r,1500))]).then(play);
</script>
</body>
</html>

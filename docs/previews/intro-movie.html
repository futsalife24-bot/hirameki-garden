<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ひらめきの庭 オープニング試作</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@500;900&family=Unbounded:wght@400;700&display=swap" rel="stylesheet">
<style>
/* 「ひらめきの庭」全体のオープニング試作。特定のゲームの世界観には寄せない。約8.6秒。 */
:root{--bg:#0b0b10;--cream:#f4f1ea;--dim:#f4f1ea80;--blue:#4a6dff;--coral:#ff5d4f;--lime:#c9f26b;--violet:#a084ff;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);overflow:hidden;color:var(--cream);font-family:'Zen Kaku Gothic New',system-ui,sans-serif}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
.layer{position:fixed;inset:0;pointer-events:none}
.frame{inset:clamp(14px,3vmin,28px)}
.frame i{position:absolute;left:0;right:0;height:1px;background:#f4f1ea30;transform-origin:left}
.frame i:first-child{top:0}.frame i:nth-child(2){bottom:0;transform-origin:right}
.cap{position:absolute;font-family:Unbounded,sans-serif;font-size:clamp(8px,1.2vmin,10px);letter-spacing:.32em;color:var(--dim);font-variant-numeric:tabular-nums}
.cap.tl{top:14px;left:0}.cap.tr{top:14px;right:0}.cap.bl{bottom:14px;left:0}.cap.br{bottom:14px;right:0}
.beat{position:absolute;left:clamp(28px,7vw,110px);bottom:clamp(70px,13vh,140px);display:flex;align-items:baseline;gap:18px;opacity:0}
.beat b{font-family:Unbounded,sans-serif;font-weight:400;font-size:clamp(10px,1.4vmin,12px);letter-spacing:.2em;color:var(--c)}
.beat span{font-weight:900;font-size:clamp(30px,5.6vmin,58px);letter-spacing:.08em}
.logo{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding-top:12vmin}
.logo h1{margin:0;font-weight:900;font-size:clamp(40px,8.4vmin,88px);letter-spacing:.12em;line-height:1.25;white-space:nowrap}
.logo h1 .m{display:inline-block;overflow:hidden;vertical-align:bottom;padding:0 .02em}
.logo h1 .m>span{display:inline-block;transform:translateY(110%)}
.logo .en{font-family:Unbounded,sans-serif;font-size:clamp(9px,1.5vmin,13px);letter-spacing:.6em;margin:18px 0 0 .6em;opacity:0}
.logo .bar{width:min(52vw,380px);height:3px;margin-top:24px;border-radius:2px;background:linear-gradient(90deg,var(--blue),var(--violet),var(--coral),var(--lime));transform:scaleX(0)}
.logo .tag{font-size:clamp(11px,1.7vmin,14px);font-weight:500;letter-spacing:.3em;margin:20px 0 0 .3em;color:#f4f1eacc;opacity:0}
#iris{position:fixed;inset:0;background:#f6f4ef;clip-path:circle(0px at 50% 50%);pointer-events:none}
.end{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;color:#2a2a30;font-size:13px;letter-spacing:.2em;line-height:2.2;opacity:0;pointer-events:none;padding:16px}
.ui{position:fixed;right:max(16px,env(safe-area-inset-right));bottom:max(18px,env(safe-area-inset-bottom));z-index:5}
.ui button{font:inherit;font-size:12px;letter-spacing:.18em;min-height:44px;padding:10px 18px;border-radius:999px;cursor:pointer;background:#f4f1ea14;border:1px solid #f4f1ea55;color:var(--cream);backdrop-filter:blur(6px)}
.ui button:focus-visible{outline:2px solid var(--lime);outline-offset:3px}
body.done .ui button{color:#2a2a30;border-color:#2a2a3055;background:transparent}
#replay{display:none}body.done #replay{display:inline-block}body.done #skip{display:none}
@media(max-width:640px){.cap.tr{display:none}.beat{left:50%;translate:-50% 0;bottom:15vh;white-space:nowrap}.logo{padding-top:14vmin}}
</style>
</head>
<body>
<canvas id="c" aria-hidden="true"></canvas>
<div class="layer frame" id="frame" aria-hidden="true"><i></i><i></i>
  <span class="cap tl">HIRAMEKI GARDEN</span><span class="cap tr">OPENING — PUZZLE COLLECTION</span>
  <span class="cap bl" id="tc">00:00:00</span><span class="cap br" id="idx">00 / 03</span>
</div>
<div class="layer" aria-hidden="true">
  <p class="beat" id="b1" style="--c:var(--blue)"><b>01</b><span>つなぐ。</span></p>
  <p class="beat" id="b2" style="--c:var(--coral)"><b>02</b><span>組みかえる。</span></p>
  <p class="beat" id="b3" style="--c:var(--lime)"><b>03</b><span>ひらめく。</span></p>
</div>
<div class="layer logo" id="logo">
  <h1 aria-label="ひらめきの庭"></h1>
  <p class="en">HIRAMEKI GARDEN</p>
  <div class="bar"></div>
  <p class="tag">ひらめきを、集める庭。</p>
</div>
<div id="iris"></div>
<p class="end" id="end">試作はここまで。<br>本編では、この光から<br>選択中のゲームの<br>タイトル画面へ切り替わります。</p>
<div class="ui"><button id="skip" type="button">スキップ ›</button><button id="replay" type="button">もう一度見る ↺</button></div>

<script>
const DURATION=8.6;
const cv=document.getElementById('c'),x=cv.getContext('2d');
const $=id=>document.getElementById(id);
const h1=document.querySelector('.logo h1');
[...'ひらめきの庭'].forEach(ch=>{const m=document.createElement('span');m.className='m';m.innerHTML=`<span>${ch}</span>`;h1.appendChild(m)});
const letters=[...h1.querySelectorAll('.m>span')];
const C={cream:'#f4f1ea',blue:'#4a6dff',coral:'#ff5d4f',lime:'#c9f26b',violet:'#a084ff'};

let W=0,H=0,S=0,cx=0,cy=0;
function resize(){const r=devicePixelRatio||1;W=innerWidth;H=innerHeight;cv.width=W*r;cv.height=H*r;x.setTransform(r,0,0,r,0,0);S=Math.min(W,H);cx=W/2;cy=H/2-S*.02}
addEventListener('resize',()=>{resize();render(now())});resize();

// 補間
const clamp=v=>Math.max(0,Math.min(1,v));
const seg=(t,a,b)=>clamp((t-a)/(b-a));
const outExpo=v=>v>=1?1:1-Math.pow(2,-10*v);
const outBack=v=>{const c=1.9;return 1+(c+1)*Math.pow(v-1,3)+c*Math.pow(v-1,2)};
const inOut=v=>v<.5?4*v*v*v:1-Math.pow(-2*v+2,3)/2;
const inCubic=v=>v*v*v;
// 前後に出入りする要素の可視度
const inoutVis=(t,a,b,f=.3)=>Math.min(seg(t,a,a+f),1-seg(t,b-f,b));

// 盤面：7×7の点、6×6のマス
const N=7;
const path=[[0,6],[0,3],[2,3],[2,1],[0,1],[0,0],[3,0],[3,2],[5,2],[5,0],[6,0],[6,4],[4,4],[4,6],[6,6]];
const pieces=[
  {cells:[[1,1],[1,2],[1,3],[2,3]],color:C.coral,t0:2.62,from:[-3,0],rot:-90},
  {cells:[[4,0],[5,0],[4,1],[5,1]],color:C.blue,t0:2.82,from:[0,-3],rot:90},
  {cells:[[3,2],[3,3],[4,3],[3,4]],color:C.lime,t0:3.02,from:[3,0],rot:90},
  {cells:[[1,5],[2,5],[3,5],[4,5]],color:C.violet,t0:3.22,from:[0,3],rot:-90},
];
function rr(px,py,w,h,r){x.beginPath();x.roundRect(px,py,w,h,r)}

function render(t){
  x.globalAlpha=1;x.fillStyle='#0b0b10';x.fillRect(0,0,W,H);
  const G=S*.5,step=G/(N-1),ox=cx-G/2,oy=cy-G/2;
  const P=(i,j)=>[ox+i*step,oy+j*step];

  // 背景の細い方眼
  const ga=.05*seg(t,1,1.8)*(1-seg(t,7.6,8.2));
  if(ga>0){x.strokeStyle=`rgba(244,241,234,${ga})`;x.lineWidth=1;const g=step/2;x.beginPath();for(let a=cx%g;a<W;a+=g){x.moveTo(a,0);x.lineTo(a,H)}for(let b=cy%g;b<H;b+=g){x.moveTo(0,b);x.lineTo(W,b)}x.stroke()}

  // 1. 光の点と十字
  const sp=seg(t,0,.55),spOut=1-seg(t,1.05,1.45);
  if(spOut>0&&t>0){
    const r=S*(.004+.006*outBack(sp))*(1+.15*Math.sin(t*14));
    const glow=x.createRadialGradient(cx,cy,0,cx,cy,S*.16*sp+1);glow.addColorStop(0,`rgba(244,241,234,${.35*spOut})`);glow.addColorStop(1,'rgba(244,241,234,0)');
    x.fillStyle=glow;x.fillRect(0,0,W,H);
    x.globalAlpha=spOut;x.fillStyle=C.cream;x.beginPath();x.arc(cx,cy,r,0,7);x.fill();
    const q=outExpo(seg(t,.35,1.15));x.globalAlpha=.4*spOut;x.fillRect(cx-W/2*q,cy-.5,W*q,1);x.fillRect(cx-.5,cy-H/2*q,1,H*q);x.globalAlpha=1;
  }

  // 4. 収束：盤面全体が中心へ吸い込まれる
  const conv=inCubic(seg(t,4.1,4.75));
  const boardA=1-seg(t,4.5,4.75);
  if(boardA>0&&t>=1){
    x.save();x.translate(cx,cy);x.rotate(conv*Math.PI/4);x.scale(1-conv*.92,1-conv*.92);x.translate(-cx,-cy);x.globalAlpha=boardA;

    // 2. 点の出現（中心から外へ）
    const maxD=Math.hypot(3,3);
    for(let i=0;i<N;i++)for(let j=0;j<N;j++){
      const d=Math.hypot(i-3,j-3)/maxD,v=seg(t,1+d*.45,1.35+d*.45);if(!v)continue;
      const [px,py]=P(i,j);x.fillStyle=C.cream;x.globalAlpha=boardA*.75;x.beginPath();x.arc(px,py,S*.0055*outBack(v),0,7);x.fill();
    }
    x.globalAlpha=boardA;

    // 2. 一筆の線が点をつなぐ
    const lp=inOut(seg(t,1.45,2.6)),la=1-.7*seg(t,2.9,3.5);
    if(lp>0){
      const pts=path.map(([i,j])=>P(i,j));let total=0;const L=[];for(let k=1;k<pts.length;k++){const l=Math.hypot(pts[k][0]-pts[k-1][0],pts[k][1]-pts[k-1][1]);L.push(l);total+=l}
      let rem=total*lp;const grad=x.createLinearGradient(ox,oy+G,ox+G,oy);grad.addColorStop(0,C.blue);grad.addColorStop(1,C.lime);
      x.strokeStyle=grad;x.lineWidth=S*.011;x.lineCap='round';x.lineJoin='round';x.globalAlpha=boardA*la;x.beginPath();x.moveTo(...pts[0]);let head=pts[0];
      for(let k=1;k<pts.length&&rem>0;k++){const f=Math.min(1,rem/L[k-1]);head=[pts[k-1][0]+(pts[k][0]-pts[k-1][0])*f,pts[k-1][1]+(pts[k][1]-pts[k-1][1])*f];x.lineTo(...head);rem-=L[k-1]}
      x.stroke();
      if(lp<1){x.fillStyle=C.lime;x.shadowColor=C.lime;x.shadowBlur=S*.03;x.beginPath();x.arc(...head,S*.012,0,7);x.fill();x.shadowBlur=0}
      x.globalAlpha=boardA;
    }

    // 3. ブロックが滑りこみ、回って収まる
    const flash=inoutVis(t,3.72,4.02,.12),gap=step*.09;
    for(const pc of pieces){
      const v=seg(t,pc.t0,pc.t0+.55);if(!v)continue;const e=outExpo(v);
      const mc=pc.cells.reduce((a,[i,j])=>[a[0]+i+.5,a[1]+j+.5],[0,0]).map(n=>n/pc.cells.length);
      const [mx,my]=P(mc[0],mc[1]);
      x.save();x.translate(mx+pc.from[0]*step*(1-e),my+pc.from[1]*step*(1-e));x.rotate(pc.rot*(1-e)*Math.PI/180);x.translate(-mx,-my);
      x.globalAlpha=boardA*Math.min(1,v*3);
      for(const [i,j] of pc.cells){const [px,py]=P(i,j);rr(px+gap,py+gap,step-gap*2,step-gap*2,step*.2);x.fillStyle=pc.color;x.fill();if(flash){x.fillStyle=`rgba(255,255,255,${flash*.85})`;x.fill()}}
      x.restore();
    }
    x.restore();x.globalAlpha=1;
  }

  // 4. 芽が伸び、ひらめきの光が弾ける → 5. ロゴの上へ移る
  const grow=seg(t,4.55,5.25);
  if(grow>0){
    const mv=inOut(seg(t,5.45,6.15)),sc=1-.5*mv,ty=-S*.2*mv,fade=1-seg(t,7.7,8.1);
    x.save();x.translate(cx,cy+ty);x.scale(sc,sc);x.globalAlpha=fade;
    const u=S*.11,stem=outExpo(grow);
    x.strokeStyle=C.cream;x.lineWidth=S*.012;x.lineCap='round';x.beginPath();x.moveTo(0,u*.9);x.lineTo(0,u*.9-u*1.3*stem);x.stroke();
    const leaf=(dir,col,v)=>{if(v<=0)return;const k=outBack(v);x.save();x.translate(0,-u*.05);x.scale(dir*k,k);x.beginPath();x.moveTo(0,0);x.bezierCurveTo(u*.2,-u*.65,u*.95,-u*.7,u*1.05,-u*.55);x.bezierCurveTo(u*.85,-u*.05,u*.3,u*.08,0,0);x.fillStyle=col;x.fill();x.restore()};
    leaf(-1,C.blue,seg(t,4.8,5.2));leaf(1,C.lime,seg(t,4.9,5.3));
    // 光のしずく
    const bulb=outBack(seg(t,4.95,5.2));x.fillStyle=C.cream;x.beginPath();x.arc(0,-u*.62,S*.018*bulb,0,7);x.fill();
    // 放射
    const br=seg(t,5.0,5.7);
    if(br>0&&br<1){const cols=[C.blue,C.coral,C.lime,C.violet];x.lineWidth=S*.008;for(let k=0;k<12;k++){const a=k/12*Math.PI*2-Math.PI/2,r0=u*(.45+.9*outExpo(br)),r1=r0+u*.35*(1-br);x.strokeStyle=cols[k%4];x.globalAlpha=fade*(1-br);x.beginPath();x.moveTo(Math.cos(a)*r0,-u*.62+Math.sin(a)*r0);x.lineTo(Math.cos(a)*r1,-u*.62+Math.sin(a)*r1);x.stroke()}}
    x.restore();x.globalAlpha=1;
  }
  const fl=inoutVis(t,4.98,5.4,.04)*.22;if(fl>0){x.fillStyle=`rgba(255,255,255,${fl})`;x.fillRect(0,0,W,H)}

  // 文字のレイヤー
  const fr=seg(t,.3,1.2),frOut=1-seg(t,7.6,8.0);
  $('frame').style.opacity=frOut;document.querySelectorAll('.frame i').forEach(i=>i.style.transform=`scaleX(${outExpo(fr)})`);
  document.querySelectorAll('.cap').forEach(c=>c.style.opacity=seg(t,.6,1.2));
  const sec=Math.min(t,DURATION);$('tc').textContent=`00:${String(Math.floor(sec)).padStart(2,'0')}:${String(Math.floor(sec%1*24)).padStart(2,'0')}`;
  $('idx').textContent=`0${t<1.2?0:t<2.6?1:t<4.4?2:3} / 03`;
  [[1.2,2.6],[2.6,4.1],[4.4,5.5]].forEach(([a,b],k)=>{const el=$('b'+(k+1)),v=inoutVis(t,a,b,.25),out=seg(t,b-.25,b);el.style.opacity=v;el.style.transform=`translateY(${(1-seg(t,a,a+.35))*18-out*14}px)`;el.style.filter=`blur(${(1-v)*5}px)`});
  letters.forEach((l,i)=>{l.style.transform=`translateY(${(1-outExpo(seg(t,5.75+i*.07,6.4+i*.07)))*110}%)`});
  const logo=$('logo');logo.style.opacity=1-seg(t,7.75,8.05);
  logo.querySelector('.en').style.opacity=seg(t,6.35,6.9);logo.querySelector('.en').style.letterSpacing=`${.6+.4*(1-outExpo(seg(t,6.35,7.2)))}em`;
  logo.querySelector('.bar').style.transform=`scaleX(${inOut(seg(t,6.5,7.2))})`;
  logo.querySelector('.tag').style.opacity=seg(t,6.9,7.4);

  // 6. 光が広がり、タイトル画面へ渡す
  const ir=inOut(seg(t,7.85,8.6)),iy=cy-S*.2-S*.11*.62*.5;$('iris').style.clipPath=`circle(${ir*Math.hypot(W/2,Math.max(iy,H-iy))+(ir>0?2:0)}px at 50% ${iy}px)`;
  $('end').style.opacity=seg(t,8.6,9.1);
  document.body.classList.toggle('done',t>=DURATION);
}

let start=0,fixed=null,raf=0;
const now=()=>fixed??(performance.now()-start)/1000;
function loop(){const t=now();render(t);if(fixed===null&&t<DURATION+.6)raf=requestAnimationFrame(loop)}
function play(){cancelAnimationFrame(raf);fixed=null;start=performance.now();loop()}
function seek(t){cancelAnimationFrame(raf);fixed=t;render(t)}
$('skip').onclick=()=>{seek(DURATION+.6);$('replay').focus()};
$('replay').onclick=()=>{play();$('skip').focus()};
const q=new URLSearchParams(location.search).get('t');
render(0);
if(q!==null)seek(parseFloat(q));
else if(matchMedia('(prefers-reduced-motion: reduce)').matches)seek(7.4);
else Promise.race([document.fonts?document.fonts.ready:Promise.resolve(),new Promise(r=>setTimeout(r,1500))]).then(play);
</script>
</body>
</html>
